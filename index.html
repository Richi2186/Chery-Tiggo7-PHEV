<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chery Tiggo 7 PHEV – Štatistiky</title>
    <!-- Chart.js pre grafy -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .car-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .car-image {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .car-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .car-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-card h4 {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 5px;
            color: var(--accent-green);
        }

        .form-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .chart-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="car-card">
        <!-- Obrázok Chery Tiggo 7 PHEV -->
        <img src="chery.jpg" alt="Chery Tiggo 7 PHEV" class="car-image">
        <div class="car-title">Chery Tiggo 7 PHEV</div>
        <div class="car-subtitle">Farba: Sivá Tech (Technical Grey)</div>
    </div>

    <!-- Štatistiky -->
    <div class="stats-grid">
        <div class="stat-card">
            <h4>Celkové Náklady/km</h4>
            <div class="value" id="avg-cost">0.00 €/km</div>
        </div>
        <div class="stat-card">
            <h4>Celkovo km</h4>
            <div class="value" id="total-km">0 km</div>
        </div>
        <div class="stat-card">
            <h4>Palivo (Spotreba)</h4>
            <div class="value" id="avg-fuel" style="color: var(--accent-orange);">0.0 l/100km</div>
        </div>
        <div class="stat-card">
            <h4>Elektrina (Spotreba)</h4>
            <div class="value" id="avg-elec" style="color: var(--accent-blue);">0.0 kWh/100km</div>
        </div>
    </div>

    <!-- Formulár na zadávanie -->
    <div class="form-card">
        <h3>Nový záznam</h3>
        <form id="log-form">
            <div class="form-group">
               <label>Typ udalosti / nákladu</label>
               <select id="type" onchange="toggleInputs()">
                   <option value="charging">Nabíjanie (Elektrina)</option>
                   <option value="fuel">Tankovanie (Benzín)</option>
                   <option value="service_regular">Pravidelný servis (Garančka/Olej)</option>
                   <option value="service_repair">Oprava / Neplánovaný servis</option>
                   <option value="service_stk">STK / Emisie / Kontroly</option>
                   <option value="insurance">Poistenie (PZP / Kasko)</option>
                   <option value="tires">Pneumatiky / Príslušenstvo</option>
                   <option value="other">Iný náklad / Umývačka</option>
               </select>
            </div>
            <div class="form-group">
               <label>Stav tachometra (km)</label>
               <input type="number" id="odometer" required placeholder="napr. 12500">
            </div>
            <div class="form-group" id="amount-group">
               <label id="amount-label">Množstvo (kWh)</label>
               <input type="number" step="0.01" id="amount" placeholder="napr. 13.5">
            </div>
            <div class="form-group">
               <label>Cena celkom (€)</label>
               <input type="number" step="0.01" id="cost" required placeholder="napr. 2.50">
            </div>
            <button type="submit">Uložiť záznam</button>
        </form>
    </div>

    <!-- Graf -->
    <div class="chart-card">
        <h3>Vývoj nákladov (€)</h3>
        <canvas id="costChart"></canvas>
    </div>

    <!-- História -->
    <div class="form-card">
        <h3>História nákladov a úkonov</h3>
        <div style="overflow-x:auto;">
            <table id="history-table">
                <thead>
                    <tr>
                        <th>KM</th>
                        <th>Typ</th>
                        <th>Množstvo</th>
                        <th>Cena</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('phev_logs')) || [];

    function toggleInputs() {
        const type = document.getElementById('type').value;
        const amountGroup = document.getElementById('amount-group');
        const label = document.getElementById('amount-label');
        const amountInput = document.getElementById('amount');

        // Ak ide o servis, poistenie alebo umývačku, množstvo nie je potrebné
        if (type.startsWith('service_') || type === 'insurance' || type === 'tires' || type === 'other') {
            amountGroup.style.display = 'none';
            amountInput.required = false;
            amountInput.value = '';
        } else {
            amountGroup.style.display = 'block';
            amountInput.required = true;
            label.innerText = type === 'charging' ? 'Množstvo (kWh)' : 'Množstvo (Litre)';
        }
    }

    document.getElementById('log-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const typeVal = document.getElementById('type').value;
        const amountVal = document.getElementById('amount').value;

        const newLog = {
            id: Date.now(),
            type: typeVal,
            odometer: parseFloat(document.getElementById('odometer').value),
            amount: amountVal ? parseFloat(amountVal) : 0,
            cost: parseFloat(document.getElementById('cost').value),
            date: new Date().toLocaleDateString('sk-SK')
        };

        logs.push(newLog);
        logs.sort((a, b) => a.odometer - b.odometer);
        localStorage.setItem('phev_logs', JSON.stringify(logs));
        
        this.reset();
        toggleInputs();
        updateUI();
    });

    function getTypeName(type) {
        switch(type) {
            case 'charging': return '⚡ Nabíjanie';
            case 'fuel': return '⛽ Benzín';
            case 'service_regular': return '🛠️ Pravidelný servis';
            case 'service_repair': return '🔧 Oprava / Servis';
            case 'service_stk': return '📋 STK / Emisie';
            case 'insurance': return '📄 Poistenie';
            case 'tires': return '🛞 Pneumatiky';
            case 'other': return '✨ Iný výdavok';
            default: return type;
        }
    }

    function updateUI() {
        const tbody = document.querySelector('#history-table tbody');
        tbody.innerHTML = '';

        let totalCost = 0;
        let totalFuel = 0;
        let totalElec = 0;

        logs.forEach(log => {
            totalCost += log.cost;
            if(log.type === 'fuel') totalFuel += log.amount;
            if(log.type === 'charging') totalElec += log.amount;

            let amountText = log.amount > 0 ? `${log.amount} ${log.type === 'charging' ? 'kWh' : 'L'}` : '-';

            const row = `<tr>
               <td>${log.odometer} km</td>
               <td>${getTypeName(log.type)}</td>
               <td>${amountText}</td>
               <td>${log.cost.toFixed(2)} €</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        if (logs.length > 1) {
            const minKm = logs[0].odometer;
            const maxKm = logs[logs.length - 1].odometer;
            const dist = maxKm - minKm;

            document.getElementById('total-km').innerText = dist + ' km';
            if(dist > 0) {
                document.getElementById('avg-cost').innerText = (totalCost / dist).toFixed(3) + ' €/km';
                document.getElementById('avg-fuel').innerText = ((totalFuel / dist) * 100).toFixed(1) + ' l/100km';
                document.getElementById('avg-elec').innerText = ((totalElec / dist) * 100).toFixed(1) + ' kWh/100km';
            }
        } else {
            document.getElementById('total-km').innerText = '0 km';
            document.getElementById('avg-cost').innerText = '0.00 €/km';
        }

        renderChart();
    }

    let chart;
    function renderChart() {
        const ctx = document.getElementById('costChart').getContext('2d');
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: logs.map(l => l.odometer + ' km'),
                datasets: [{
                    label: 'Celková cena úkonu (€)',
                    data: logs.map(l => l.cost),
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.2)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    }

    // Inicializácia pri štarte
    toggleInputs();
    updateUI();
</script>
</body>
</html>
